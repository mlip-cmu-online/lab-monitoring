global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'lab-monitoring'

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kafka-monitoring'
    scrape_interval: 5s
    static_configs:
      # kafka-monitoring.py runs in the DevContainer (the Docker host), not
      # inside this Compose network.
      - targets: ['host.docker.internal:8765']

  - job_name: 'node-exporter'
    scrape_interval: 5s
    static_configs:
      # Container-to-container traffic uses Compose service DNS.
      - targets: ['node-exporter:9100']
